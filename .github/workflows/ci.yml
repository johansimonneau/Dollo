# Garde-fou : chaque PR est vérifiée AVANT d'être fusionnée (donc avant d'arriver chez les parents).
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Base (sécurité RLS, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Toutes les migrations + suites de sécurité sur une base jetable
        run: ./scripts/test-rls.sh
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432

  reminders:
    name: Fonction rappels (envoi des notifications)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Certificat de test (faux service push en HTTPS)
        run: openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout /tmp/key.pem -out /tmp/cert.pem -days 1 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
      - name: Envoi de bout en bout (faux Supabase + faux service push)
        working-directory: supabase/functions/send-reminders
        # Le certificat de test est AJOUTÉ aux autorités de confiance (on ne désactive pas la vérification TLS).
        run: deno test -A --cert /tmp/cert.pem --config deno.json
        env:
          TEST_CERT: /tmp/cert.pem
          TEST_KEY: /tmp/key.pem
          NODE_EXTRA_CA_CERTS: /tmp/cert.pem
